name: finanzas
description: Gestor Financiero Personal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  share_plus: ^10.0.0
  file_picker: ^8.0.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  http: ^1.2.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icono/otto_icono.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "icono/otto_icono.png"

flutter:
  uses-material-design: true
  assets:
    - assets/otto.png
    - assets/otto_cara.png
